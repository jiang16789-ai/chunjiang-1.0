# chunjiang1.0 第三轮微调配置（本地模型批 1103 条续训 batch2 adapter）
# 本机核验 mlx-lm 0.31.3
# 决策：从 batch2 final adapter 续训 clean 风格，不从头训、不重混全量
# 跑法：
#   python3 -m mlx_lm lora --config train_config_batch3.yaml

model: ~/.cache/huggingface/hub/models--mlx-community--Qwen3-8B-4bit/snapshots/545dc4251c05440727734bcd94334791f6ab0192
data: /path/to/chunjiang1.0/data/train_local_batch3

train: true
test: false
fine_tune_type: lora

# 续训起点：batch2 最终 adapter（resume_adapter_file 与 max_seq_length 解耦，3072→4096 兼容）
resume_adapter_file: /path/to/chunjiang1.0/adapters/chunjiang1.0-batch2-r8-lr6e5/adapters.safetensors
adapter_path: /path/to/chunjiang1.0/adapters/chunjiang1.0-batch3-resume-r8-lr2e5

mask_prompt: true
seed: 42

# 优化器：沿用 batch2 已验证的 adamw
optimizer: adamw
optimizer_config:
  adamw:
    weight_decay: 0.01
    betas: [0.9, 0.95]
    eps: 1.0e-8

# LR：2e-5 = batch2 峰值 6e-5 的 1/3，防小样本覆盖已学权重；resume 不恢复 optimizer state
learning_rate: 2.0e-5
lr_schedule:
  name: cosine_decay
  arguments: [2.0e-5, 152, 2.0e-6]
  warmup: 15
  warmup_init: 0.0

# 训练长度：train 827 条 ÷ batch 6 = 137.8 iters/epoch；152 × 6 / 827 ≈ 1.10 epoch
iters: 152
batch_size: 6
grad_accumulation_steps: 1

# 序列：4096 统一评估口径；语料 max token 1977，无截断压力
max_seq_length: 4096
grad_checkpoint: true
clear_cache_threshold: 0

# 验证/存档：152 iters 下每 20 步评估+存档，捕捉小样本过拟合拐点
steps_per_report: 10
steps_per_eval: 20
val_batches: -1
save_every: 20

# LoRA：必须与 batch2 adapter shape 一致（rank 8 / 16 层 / scale 20 / dropout 0.05）
num_layers: 16
lora_parameters:
  rank: 8
  scale: 20.0
  dropout: 0.05

# 训完选最低 val checkpoint 后再全量评估 test
test_batches: -1
